# تشغيل المنصة على خادم (VPS) مع شهادة HTTPS تلقائية عبر Caddy
#   1) انسخ .env.example إلى .env وعدّل القيم
#   2) docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
      APP_VERSION: ${APP_VERSION:-}   # يُضبط تلقائيًا من سكربتات التثبيت والتحديث
    volumes:
      - ./data:/app/data          # قاعدة البيانات والصور وملفات الشواهد — انسخها احتياطيًا

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
