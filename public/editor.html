<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المحرر — إنجاز</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#5f978f">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/assets/style.css">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
.ebar{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap;z-index:20}
.ebar .title{font-weight:800;font-size:1.1em;border:1px solid transparent;background:transparent;border-radius:8px;padding:.3em .5em;min-width:120px;width:min(320px,40vw)}
.ebar .title:hover,.ebar .title:focus{border-color:var(--line);background:#fff;outline:none}
.save-st{font-size:.85em;color:var(--muted);white-space:nowrap}
.save-st.err{color:var(--danger)}
.ebar select.input{width:auto;padding:.42em .6em}
.wrap{flex:1;display:flex;min-height:0}
.side{width:300px;background:#fff;border-inline-start:0;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-h{padding:14px 16px 8px;font-weight:800;display:flex;align-items:center}
.plist{flex:1;overflow:auto;padding:4px 10px 10px}
.pitem{display:flex;align-items:center;gap:8px;padding:.5em .6em;border-radius:10px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.pitem:hover{background:var(--bg)}
.pitem.on{background:var(--brand-l);border-color:#bcd8d2}
.pitem .n{width:24px;height:24px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font-size:.78em;font-weight:700;flex:none;color:var(--muted)}
.pitem.on .n{background:var(--brand);color:#fff}
.pitem .t{flex:1;font-weight:500;font-size:.94em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .w{font-size:.7em;color:var(--muted);flex:none}
.pitem .mv{display:none;gap:2px}
.pitem:hover .mv{display:flex}
.pitem .mv button{border:0;background:#fff;border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:.75em;color:var(--muted)}
.pitem .mv button:hover{color:var(--brand-d);background:var(--brand-l)}
.side-f{padding:12px;border-top:1px solid var(--line)}
.main{flex:1;overflow:auto;padding:22px 22px 80px}
.inner{max-width:860px;margin:0 auto}
.phead{padding:18px 20px;margin-bottom:16px}
.phead .ptitle{width:100%;font-size:1.4em;font-weight:800;border:1px solid transparent;border-radius:10px;padding:.2em .4em;background:transparent}
.phead .ptitle:hover,.phead .ptitle:focus{border-color:var(--line);outline:none;background:#fff}
.popts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:.92em}
.popts label{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;background:var(--bg);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:.3em .8em;border-radius:7px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.note{background:var(--brand-l);border-radius:12px;padding:12px 16px;margin-bottom:14px;color:var(--brand-d)}
.blk{margin-bottom:14px;overflow:hidden}
.blk-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fcfbf9}
.blk-h .type{font-size:.8em;font-weight:700;background:var(--accent-l);color:#9b5a2e;padding:.15em .6em;border-radius:6px;white-space:nowrap}
.blk-h .heading{flex:1;border:1px solid transparent;background:transparent;border-radius:8px;padding:.3em .5em;font-weight:700;min-width:0}
.blk-h .heading:hover,.blk-h .heading:focus{border-color:var(--line);background:#fff;outline:none}
.blk-b{padding:14px}
.rte-bar{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.rte-bar button{border:1px solid var(--line);background:#fff;border-radius:7px;min-width:32px;height:30px;cursor:pointer;font-weight:700}
.rte-bar button:hover{border-color:var(--brand);color:var(--brand-d)}
.rte-bar .sep{width:1px;background:var(--line);margin:0 4px}
.rte{min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;outline:none;background:#fff;line-height:1.75}
.rte:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
.rte p{margin:0 0 .5em}
.rte ul,.rte ol{margin:0 0 .5em;padding-inline-start:1.4em}
.rte h3{font-size:1.1em;color:var(--brand-d);margin:.2em 0}
.frow{display:grid;grid-template-columns:180px 1fr 34px;gap:8px;margin-bottom:8px;align-items:start}
.frow.locked{grid-template-columns:150px 1fr}
.locked-val{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:.6em .85em;color:var(--ink);font-weight:700;min-width:0}
.locked-val span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locked-val small{color:var(--muted);font-weight:500;white-space:nowrap}
.frow .lbl{font-weight:700}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
.etbl{border-collapse:collapse;width:100%;min-width:480px}
.etbl td,.etbl th{border:1px solid var(--line);padding:0;position:relative}
.etbl input,.etbl textarea{border:0;width:100%;padding:.5em;background:transparent;outline:none;resize:none;display:block;min-height:2.4em}
.etbl th input{font-weight:800;background:var(--accent-l)}
.etbl input:focus,.etbl textarea:focus{background:#f2faf8}
.etbl .rm{border:0;background:none;color:var(--muted);cursor:pointer;width:28px}
.etbl .rm:hover{color:var(--danger)}
.tbl-acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.itile{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.itile .pic{aspect-ratio:1.2;background:var(--bg);display:grid;place-items:center;cursor:pointer;position:relative}
.itile .pic img{width:100%;height:100%;object-fit:contain}
.itile .pic .ph{color:var(--muted);font-size:.85em;text-align:center}
.itile .pic .x{position:absolute;top:6px;left:6px;background:rgba(255,255,255,.92);border:0;border-radius:6px;width:26px;height:26px;cursor:pointer}
.itile input.cap{border:0;border-top:1px solid var(--line);width:100%;padding:.45em .6em;outline:none;font-size:.88em}
.lrow{display:grid;grid-template-columns:1fr 1.5fr 54px 34px;gap:8px;margin-bottom:8px;align-items:center}
.lrow .src{display:flex;gap:6px;align-items:center;min-width:0}
.lrow .src .input{flex:1;min-width:0}
.fchip{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--brand-l);border:1px solid #bcd8d2;border-radius:10px;padding:.5em .75em;font-weight:700;overflow:hidden;white-space:nowrap}
.fchip a{overflow:hidden;text-overflow:ellipsis;color:var(--brand-d);text-decoration:none}
.fchip a:hover{text-decoration:underline}
.upbar{flex:1;height:8px;background:var(--bg);border-radius:9px;overflow:hidden}
.upbar span{display:block;height:100%;background:var(--brand);transition:width .2s}
.lrow .qr{width:54px;height:54px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;font-size:.65em;color:var(--muted);background:#fff;overflow:hidden}
.lrow .qr img{width:100%;height:100%}
.addbar{border:2px dashed #cfdcd8;border-radius:14px;padding:14px;text-align:center}
.addbar .opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.ro-banner{background:var(--accent-l);padding:10px 16px;text-align:center;font-weight:500}
.side-toggle{display:none}
@media (max-width:900px){
  .side{position:fixed;top:0;bottom:0;right:0;z-index:50;transform:translateX(100%);transition:.2s;box-shadow:var(--shadow-l)}
  .side.open{transform:none}
  .side-toggle{display:inline-flex}
  .main{padding:14px 12px 80px}
  .frow{grid-template-columns:1fr 34px}.frow .lab{grid-column:1 / -1}
  .frow.locked{grid-template-columns:1fr}
  .lrow{grid-template-columns:1fr 54px 34px}.lrow .t{grid-column:1 / -1}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div class="ebar">
  <a class="btn icon ghost" href="/app" title="ملفاتي">→</a>
  <button class="btn sm side-toggle" onclick="toggleSide()">☰ الصفحات</button>
  <input class="title" id="projTitle" aria-label="اسم الملف">
  <span class="save-st" id="saveSt"></span>
  <div class="spacer"></div>
  <select class="input" id="themeSel" title="الألوان"></select>
  <select class="input" id="layoutSel" title="شكل الصفحات">
    <option value="spread">دفتر مفتوح (صفحتين)</option>
    <option value="single">صفحة مفردة A4</option>
  </select>
  <button class="btn" id="previewBtn">👁 معاينة</button>
  <button class="btn primary" id="pdfBtn">⬇ تنزيل PDF</button>
</div>
<div class="ro-banner" id="roBanner" style="display:none">اشتراكك غير مفعل — الملف للعرض فقط. <a href="/subscribe">فعّل اشتراكك</a> للتعديل والتصدير.</div>
<div class="wrap">
  <aside class="side" id="side">
    <div class="side-h">صفحات الملف <div class="spacer"></div><span class="muted" style="font-weight:500;font-size:.85em" id="pcount"></span></div>
    <div class="plist" id="plist"></div>
    <div class="side-f"><button class="btn" style="width:100%" onclick="openAddPage()">＋ إضافة صفحة</button></div>
  </aside>
  <main class="main"><div class="inner" id="pageArea"><div class="empty-state"><span class="spinner dark"></span></div></div></main>
</div>

<div class="modal-bg" id="addPageModal">
  <div class="modal">
    <h3>إضافة صفحة جديدة</h3>
    <div class="field"><label for="npTitle">عنوان الصفحة</label><input class="input" id="npTitle" placeholder="مثال: الأنشطة الطلابية"></div>
    <div class="field"><label>عرض الصفحة</label>
      <div class="seg" id="npWidth"><button data-v="half" class="on">صفحة واحدة</button><button data-v="full">صفحتين متقابلتين (للصور والجداول)</button></div>
    </div>
    <div class="field"><label>محتوى البداية</label>
      <select class="input" id="npStart">
        <option value="text">نص</option>
        <option value="links">روابط ورموز QR</option>
        <option value="table">جدول</option>
        <option value="images">صور</option>
        <option value="fields">حقول بيانات</option>
        <option value="">صفحة فارغة</option>
      </select>
    </div>
    <div class="modal-actions"><button class="btn primary" onclick="addPage()">إضافة</button><button class="btn" data-close>إلغاء</button></div>
  </div>
</div>

<div class="modal-bg" id="confirmModal">
  <div class="modal">
    <h3 id="cfTitle">تأكيد</h3>
    <p id="cfText"></p>
    <div class="modal-actions"><button class="btn danger" id="cfOk">حذف</button><button class="btn" data-close>إلغاء</button></div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<input type="file" id="docInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.png,.jpg,.jpeg,.webp,.gif,.mp4,.mp3,.txt" hidden>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/editor.js"></script>
</body>
</html>
