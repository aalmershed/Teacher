<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الاشتراك — ملف إنجاز المعلم</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#5f978f">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/assets/style.css">
<style>
main{padding:36px 0 60px;text-align:center}
.status{display:inline-block;padding:14px 22px;margin:8px 0 28px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,320px));gap:20px;justify-content:center;text-align:right}
.plan{padding:26px;cursor:pointer;border:2px solid var(--line);transition:.15s}
.plan.sel{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-l)}
.price{font-size:2.4em;font-weight:800;color:var(--brand-d)}
.price small{font-size:.42em;color:var(--muted);font-weight:500}
.note{max-width:520px;margin:20px auto 0;font-size:.9em}
.result{max-width:560px;margin:0 auto 22px;padding:16px 20px;border-radius:14px;font-weight:700;display:none}
.result.ok{display:block;background:#e3f3ea;color:#2d7a52;border:1px solid #bfe3cf}
.result.bad{display:block;background:#fbeceb;color:var(--danger);border:1px solid #f1c9c5}
.paybox{max-width:460px;margin:26px auto 0;text-align:right;padding:22px;display:none}
.paybox.open{display:block}
.paybox h3{margin:0 0 4px}
.secure{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.85em;margin-top:12px;justify-content:center}
</style>
</head>
<body>
<header class="topbar"><div class="container"><a class="logo" href="/app"><span class="logo-mark">م</span>ملف إنجاز المعلم</a><div class="spacer"></div><a class="btn" href="/app">← ملفاتي</a></div></header>
<main class="container">
  <h1>الاشتراك في المنصة</h1>
  <div class="result" id="result"></div>
  <div class="card status" id="status"></div>
  <div class="plans" id="plans"></div>
  <div style="margin-top:26px"><button class="btn primary lg" id="payBtn">متابعة الدفع</button></div>
  <div class="card paybox" id="paybox">
    <h3 id="payTitle">إتمام الدفع</h3>
    <p class="muted" style="margin:0 0 14px" id="payAmount"></p>
    <div class="mysr-form"></div>
    <div class="secure">🔒 دفع آمن عبر ميسر · مدى، فيزا، ماستركارد</div>
  </div>
  <p class="muted note" id="mockNote"></p>
</main>
<script src="/assets/js/common.js"></script>
<script>
let sel = 'yearly';

// نتيجة الرجوع من بوابة الدفع
(function () {
  const q = new URLSearchParams(location.search);
  const box = document.getElementById('result');
  if (q.get('pay') === 'success') { box.className = 'result ok'; box.textContent = 'تم الدفع وتفعيل اشتراكك بنجاح 🎉 تقدر الآن تنزّل ملفاتك PDF.'; }
  if (q.get('pay') === 'failed') { box.className = 'result bad'; box.textContent = 'لم تكتمل عملية الدفع' + (q.get('msg') ? ': ' + q.get('msg') : '') + '. لم يُفعّل الاشتراك، يمكنك المحاولة مرة أخرى.'; }
})();

function loadMoyasar() {
  if (window.Moyasar) return Promise.resolve();
  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = '/vendor/moyasar/moyasar.css';
  document.head.appendChild(css);
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/vendor/moyasar/moyasar.umd.js';
    s.onload = resolve; s.onerror = () => reject(new Error('تعذر تحميل نموذج الدفع'));
    document.head.appendChild(s);
  });
}

async function showMoyasar(form) {
  await loadMoyasar();
  const box = document.getElementById('paybox');
  document.querySelector('.mysr-form').innerHTML = '';
  document.getElementById('payTitle').textContent = form.description;
  document.getElementById('payAmount').textContent = `المبلغ: ${(form.amount / 100).toFixed(2)} ر.س`;
  box.classList.add('open');
  window.Moyasar.init({ element: '.mysr-form', language: 'ar', ...form });
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
(async () => {
  const user = await currentUser();
  if (!user) return;
  const s = user.subscription;
  document.getElementById('status').innerHTML = s.active
    ? `${subBadge(s)}<div class="muted" style="margin-top:6px">يمكنك التجديد الآن وستُضاف المدة إلى اشتراكك الحالي.</div>`
    : `${subBadge(s)}<div class="muted" style="margin-top:6px">استخدام المنصة مجاني. اشترك لتنزيل ملفات الإنجاز بصيغة PDF.</div>`;
  if (s.provider === 'mock') document.getElementById('mockNote').textContent = 'ملاحظة: بوابة الدفع في الوضع التجريبي حاليًا — سيتم تفعيل الاشتراك مباشرة بدون دفع فعلي.';
  if (s.provider === 'manual') {
    document.getElementById('mockNote').textContent = 'التفعيل حاليًا يتم يدويًا: تواصل معنا لإتمام الدفع، وسيُفعّل اشتراكك مباشرة على نفس الحساب.';
    document.getElementById('payBtn').textContent = 'طلب التفعيل';
  }

  const { plans, currency } = await api('GET', '/api/plans');
  const box = document.getElementById('plans');
  box.innerHTML = plans.map((p) => `
    <div class="card plan ${p.id === sel ? 'sel' : ''}" data-id="${p.id}">
      <h3>${esc(p.name)}</h3>
      <div class="price">${p.price} <small>${currency} / ${p.id === 'yearly' ? 'سنة' : 'شهر'}</small></div>
      <div class="muted">${p.id === 'yearly' ? `توفير ${Math.round(100 - (p.price / (plans.find((x) => x.id === 'monthly').price * 12)) * 100)}% مقارنة بالشهري` : 'مرونة كاملة، جدّد متى شئت'}</div>
    </div>`).join('');
  box.querySelectorAll('.plan').forEach((el) => el.onclick = () => {
    sel = el.dataset.id;
    box.querySelectorAll('.plan').forEach((x) => x.classList.toggle('sel', x === el));
  });
})();

document.getElementById('payBtn').onclick = async (e) => {
  const btn = e.currentTarget;
  btn.disabled = true;
  try {
    const r = await api('POST', '/api/subscribe', { plan: sel });
    if (r.provider === 'moyasar') { await showMoyasar(r.form); btn.disabled = false; btn.textContent = 'تغيير الخطة'; return; }
    if (r.redirectUrl) { location.href = r.redirectUrl; return; }
    toast('تم تفعيل الاشتراك بنجاح 🎉', 'ok');
    setTimeout(() => { location.href = '/app'; }, 900);
  } catch (err) { toast(err.message, 'err'); btn.disabled = false; }
};
</script>
</body>
</html>
