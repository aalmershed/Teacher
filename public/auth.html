<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الدخول — مركز المعلم</title>
<meta name="description" content="سجّل مجانًا في منصة مركز المعلم وأنشئ ملف إنجازك الإلكتروني بقالب جاهز وشواهد بباركود QR وتصدير PDF.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#5f978f">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/assets/style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 400px at 100% 0,var(--brand-l),transparent),radial-gradient(700px 400px at 0 100%,var(--accent-l),transparent),var(--bg)}
.box{width:min(430px,100%);padding:30px}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin:18px 0 22px}
.tabs a{flex:1;text-align:center;padding:.5em;border-radius:9px;font-weight:700;text-decoration:none;color:var(--muted)}
.tabs a.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.err{background:#fbeceb;color:var(--danger);padding:.6em .9em;border-radius:10px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="card box">
  <a class="logo" href="/"><span class="logo-mark">م</span>مركز المعلم</a>
  <div class="tabs"><a href="/login" id="tLogin">تسجيل الدخول</a><a href="/register" id="tReg">حساب جديد</a></div>
  <div class="err" id="err"></div>
  <form id="form" novalidate>
    <div class="field reg"><label for="name">الاسم الكامل</label><input class="input" id="name" autocomplete="name" placeholder="مثال: نورة السبيعي"></div>
    <div class="field"><label for="email">البريد الإلكتروني</label><input class="input" id="email" type="email" autocomplete="email" dir="ltr"></div>
    <div class="field reg"><label for="phone">رقم الجوال (اختياري)</label><input class="input" id="phone" type="tel" autocomplete="tel" dir="ltr" placeholder="05xxxxxxxx"></div>
    <div class="field"><label for="password">كلمة المرور</label><input class="input" id="password" type="password" autocomplete="current-password" dir="ltr"></div>
    <div class="login-only" style="text-align:left;margin:-6px 0 14px"><a href="/forgot" style="font-size:.9em;font-weight:700">نسيت كلمة المرور؟</a></div>
    <button class="btn primary lg" style="width:100%" id="submit">دخول</button>
  </form>
  <p class="muted reg" style="font-size:.9em;margin-bottom:0" id="trialNote"></p>
</div>
<script src="/assets/js/common.js"></script>
<script>
const isReg = location.pathname.startsWith('/register');
document.getElementById(isReg ? 'tReg' : 'tLogin').classList.add('on');
document.querySelectorAll('.reg').forEach((el) => { el.style.display = isReg ? '' : 'none'; });
document.querySelectorAll('.login-only').forEach((el) => { el.style.display = isReg ? 'none' : ''; });
document.getElementById('submit').textContent = isReg ? 'إنشاء الحساب' : 'دخول';
document.getElementById('password').autocomplete = isReg ? 'new-password' : 'current-password';
document.title = (isReg ? 'حساب جديد' : 'تسجيل الدخول') + ' — مركز المعلم';
if (isReg) api('GET', '/api/plans').then(({ trialDays }) => {
  document.getElementById('trialNote').textContent = trialDays > 0
    ? `تحصل على فترة تجريبية مجانية لمدة ${trialDays} أيام فور التسجيل.`
    : 'التسجيل مجاني: أنشئ ملفك وعدّله بدون دفع، واشترك فقط عند تنزيله PDF.';
});

const next = new URLSearchParams(location.search).get('next');
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit');
  const errBox = document.getElementById('err');
  errBox.style.display = 'none';
  btn.disabled = true;
  const v = (id) => document.getElementById(id).value;
  try {
    if (isReg) await api('POST', '/api/auth/register', { name: v('name'), email: v('email'), phone: v('phone'), password: v('password') });
    else await api('POST', '/api/auth/login', { email: v('email'), password: v('password') });
    location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/app';
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
