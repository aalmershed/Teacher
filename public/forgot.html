<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>استعادة كلمة المرور — ملف إنجاز المعلم</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#5f978f">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/assets/style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 400px at 100% 0,var(--brand-l),transparent),radial-gradient(700px 400px at 0 100%,var(--accent-l),transparent),var(--bg)}
.box{width:min(430px,100%);padding:30px}
h1{font-size:1.35em;margin:18px 0 6px}
.err,.ok{padding:.6em .9em;border-radius:10px;margin-bottom:12px;display:none}
.err{background:#fbeceb;color:var(--danger)}
.ok{background:#e3f3ea;color:#2d7a52}
.back{display:block;text-align:center;margin-top:16px;font-weight:700}
</style>
</head>
<body>
<div class="card box">
  <a class="logo" href="/"><span class="logo-mark">م</span>ملف إنجاز المعلم</a>
  <h1 id="title">نسيت كلمة المرور؟</h1>
  <p class="muted" id="lead" style="margin-top:0">اكتب بريدك المسجل وسنرسل لك رابطًا لتعيين كلمة مرور جديدة.</p>
  <div class="err" id="err"></div>
  <div class="ok" id="ok"></div>

  <form id="askForm" novalidate>
    <div class="field"><label for="email">البريد الإلكتروني</label><input class="input" id="email" type="email" autocomplete="email" dir="ltr"></div>
    <button class="btn primary lg" style="width:100%" id="askBtn">إرسال رابط الاستعادة</button>
  </form>

  <form id="resetForm" novalidate hidden>
    <div class="field"><label for="password">كلمة المرور الجديدة</label><input class="input" id="password" type="password" autocomplete="new-password" dir="ltr" placeholder="8 أحرف على الأقل"></div>
    <div class="field"><label for="password2">تأكيد كلمة المرور</label><input class="input" id="password2" type="password" autocomplete="new-password" dir="ltr"></div>
    <button class="btn primary lg" style="width:100%" id="resetBtn">حفظ كلمة المرور</button>
  </form>

  <a class="back" href="/login">← العودة لتسجيل الدخول</a>
</div>
<script src="/assets/js/common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const show = (id, msg) => { ['err', 'ok'].forEach((k) => { $(k).style.display = 'none'; }); if (msg) { $(id).textContent = msg; $(id).style.display = 'block'; } };
const token = new URLSearchParams(location.search).get('token');

if (location.pathname.startsWith('/reset')) {
  $('askForm').hidden = true;
  $('title').textContent = 'تعيين كلمة مرور جديدة';
  $('lead').textContent = 'اختر كلمة مرور جديدة لحسابك.';
  if (!token) { show('err', 'الرابط غير مكتمل. افتح الرابط من رسالة البريد كما هو.'); }
  else $('resetForm').hidden = false;
  history.replaceState(null, '', '/reset'); // إخفاء الرمز من شريط العنوان
} else {
  api('GET', '/api/auth/forgot').then((d) => {
    if (d.email) return;
    $('askForm').hidden = true;
    $('lead').innerHTML = 'لإعادة تعيين كلمة المرور تواصل معنا وسنساعدك مباشرة' + (d.contact ? `:<br><b dir="ltr" style="display:inline-block;margin-top:6px">${esc(d.contact)}</b>` : '.');
  });
}

$('askForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) return show('err', 'اكتب بريدًا إلكترونيًا صحيحًا');
  $('askBtn').disabled = true;
  try {
    await api('POST', '/api/auth/forgot', { email });
    $('askForm').hidden = true;
    show('ok', 'إذا كان البريد مسجلًا لدينا فستصلك رسالة خلال دقائق فيها رابط تعيين كلمة المرور. تحقق أيضًا من مجلد الرسائل غير المرغوب فيها (Spam).');
  } catch (err) { show('err', err.message); $('askBtn').disabled = false; }
});

$('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = $('password').value;
  if (password.length < 8) return show('err', 'كلمة المرور يجب ألا تقل عن 8 أحرف');
  if (password !== $('password2').value) return show('err', 'كلمتا المرور غير متطابقتين');
  $('resetBtn').disabled = true;
  try {
    await api('POST', '/api/auth/reset', { token, password });
    $('resetForm').hidden = true;
    show('ok', 'تم تغيير كلمة المرور بنجاح ✓ جارٍ تحويلك إلى ملفاتك…');
    setTimeout(() => { location.href = '/app'; }, 1200);
  } catch (err) { show('err', err.message); $('resetBtn').disabled = false; }
});
</script>
</body>
</html>
