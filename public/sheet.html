<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كشف متابعة الطلاب — مركز المعلم</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#5f978f">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/assets/style.css">
<style>
.bar{display:flex;align-items:center;gap:10px}
.bar .ttl-in{font-weight:800;font-size:1.05em;border:1px solid transparent;background:transparent;padding:.35em .5em;border-radius:8px;min-width:120px;flex:1;max-width:360px;font-family:inherit;color:inherit}
.bar .ttl-in:hover,.bar .ttl-in:focus{border-color:var(--line);background:#fff;outline:none}
.save-st{font-size:.85em;color:var(--muted);white-space:nowrap}
.wrap{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:22px;padding:22px 0 60px;align-items:start}
.form{padding:18px 18px 8px}
.form h3{font-size:1em;margin:20px 0 10px;color:var(--brand-d)}
.form h3:first-child{margin-top:0}
.themes{display:flex;gap:8px;flex-wrap:wrap}
.th{border:2px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;background:#fff;font:inherit;font-size:.82em;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--ink)}
.th.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
.th i{display:flex;border-radius:5px;overflow:hidden}.th i b{width:10px;height:18px}
textarea.input{min-height:120px;resize:vertical;line-height:1.7}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:.82em;color:var(--muted);margin-top:4px}
.grp{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fbfdfc}
.grp-h{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.grp-h .input{font-weight:700}
.grp-h .tot{font-size:.8em;color:var(--muted);white-space:nowrap}
.sub{display:grid;grid-template-columns:1fr 62px 62px 30px;gap:6px;align-items:center;margin-bottom:6px}
.sub-h{display:grid;grid-template-columns:1fr 62px 62px 30px;gap:6px;font-size:.75em;color:var(--muted);margin-bottom:2px}
.sub .input{padding:.45em .5em;font-size:.9em}
.x{padding:.2em .4em;font-size:.85em}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--brand-l);border-radius:10px;padding:.6em .9em;font-weight:800;margin:8px 0}
.logos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.logo-box{border:2px dashed var(--line);border-radius:12px;min-height:84px;display:grid;place-items:center;text-align:center;cursor:pointer;font-size:.85em;color:var(--muted);position:relative;padding:8px;background:#fbfdfc}
.logo-box img{max-width:100%;max-height:64px;object-fit:contain}
.logo-box .rm{position:absolute;top:4px;left:4px;padding:.1em .45em;font-size:.8em}
.pv{position:sticky;top:76px}
.pv-frame{background:#e9ece9;border-radius:16px;padding:14px}
.pv-box{width:100%;aspect-ratio:297/210;position:relative;overflow:hidden;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.14);background:#fff}
.pv-box iframe{position:absolute;top:0;right:0;width:1123px;height:794px;border:0;transform-origin:top right}
.pv-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;font-weight:700}
.pv-acts{display:flex;gap:8px;justify-content:center;margin-top:12px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.pv{position:static;order:-1}}
@media (max-width:560px){.save-st{display:none}#pdfBtn{padding:.5em .8em;font-size:.9em}}
</style>
</head>
<body>
<header class="topbar">
  <div class="container bar">
    <a class="btn ghost sm" href="/app#sheets" title="رجوع">→</a>
    <input class="ttl-in" id="title" maxlength="100" aria-label="اسم الكشف">
    <span class="save-st" id="saveSt"></span>
    <div class="spacer"></div>
    <button class="btn primary" id="pdfBtn">⬇ تنزيل PDF</button>
  </div>
</header>

<main class="container wrap">
  <div class="card form" id="form">
    <h3>اللون</h3>
    <div class="themes" id="themes"></div>

    <h3>رأس الكشف</h3>
    <div class="field"><label for="f-line1">السطر الأول</label><input class="input" id="f-line1" maxlength="120" placeholder="الإدارة العامة للتعليم بمنطقة ..."></div>
    <div class="field"><label for="f-line2">السطر الثاني</label><input class="input" id="f-line2" maxlength="120" placeholder="مكتب التعليم ..."></div>
    <div class="field"><label for="f-school">اسم المدرسة</label><input class="input" id="f-school" maxlength="80"></div>
    <div class="row2">
      <div class="field"><label for="f-title">عنوان الكشف</label><input class="input" id="f-title" maxlength="80"></div>
      <div class="field"><label for="f-year">العام الدراسي</label><input class="input" id="f-year" maxlength="30" placeholder="مثال: 1448هـ"></div>
    </div>

    <h3>بيانات الفصل</h3>
    <div class="row2">
      <div class="field"><label for="f-grade">الصف</label><input class="input" id="f-grade" maxlength="40" placeholder="مثال: الأول المتوسط"></div>
      <div class="field"><label for="f-section">الفصل</label><input class="input" id="f-section" maxlength="40" placeholder="مثال: 1/أ"></div>
      <div class="field"><label for="f-term">الفصل الدراسي</label><input class="input" id="f-term" maxlength="40" placeholder="مثال: الأول"></div>
      <div class="field"><label for="f-subject">المادة (اختياري)</label><input class="input" id="f-subject" maxlength="60"></div>
    </div>
    <div class="field"><label for="f-teacher">اسم المعلم (اختياري)</label><input class="input" id="f-teacher" maxlength="80"></div>

    <h3>أسماء الطلاب</h3>
    <div class="field">
      <textarea class="input" id="f-names" placeholder="اكتب أو الصق أسماء الطلاب، كل اسم في سطر"></textarea>
      <div class="hint" id="namesHint"></div>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center">
        <button class="btn sm" id="sortBtn" type="button">ترتيب أبجدي</button>
        <label style="display:flex;align-items:center;gap:6px;font-size:.9em">عدد الصفوف في الصفحة
          <select class="input" id="f-rows" style="width:auto;padding:.3em .5em"></select></label>
      </div>
    </div>

    <h3>توزيع الدرجات</h3>
    <div id="groups"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn sm" id="addGroup" type="button">＋ مجموعة جديدة</button>
      <button class="btn sm ghost" id="resetGroups" type="button">استعادة التوزيع الافتراضي</button>
    </div>
    <div class="total"><span>المجموع الكلي</span><span id="total"></span></div>
    <p class="hint">«الخانات» هي المربعات الصغيرة بجانب كل بند لرصد المتابعة اليومية (مثل الواجبات أو المشاركة).</p>

    <h3>الشعارات (اختياري)</h3>
    <div class="logos">
      <div class="logo-box" data-logo="logoRight"></div>
      <div class="logo-box" data-logo="logoLeft"></div>
    </div>
    <p class="hint">ارفع شعار مدرستك أو أي شعار لديك حق استخدامه (PNG بخلفية شفافة يعطي أفضل نتيجة).</p>
    <input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp" hidden>
  </div>

  <div class="pv">
    <div class="pv-frame">
      <div class="pv-box" id="pvBox"><iframe id="pv" title="معاينة الكشف"></iframe></div>
      <div class="pv-nav" id="pvNav" hidden><button class="btn sm" id="pvPrev">→</button><span id="pvIdx" dir="ltr"></span><button class="btn sm" id="pvNext">←</button></div>
    </div>
    <div class="pv-acts"><button class="btn primary lg" id="pdfBtn2">⬇ تنزيل PDF</button></div>
  </div>
</main>

<script src="/assets/js/common.js"></script>
<script src="/assets/js/sheet-render.js"></script>
<script>
const id = location.pathname.split('/').pop();
const $ = (x) => document.getElementById(x);
let data, themes = [], defaultGroups = [], pageIdx = 0, watermark = true, saveTimer = null;
const FONT = '@import url(/assets/fonts.css);';
const imgUrl = (u) => '/api/uploads/' + u;

for (let r = 8; r <= 30; r++) $('f-rows').insertAdjacentHTML('beforeend', `<option value="${r}">${r}</option>`);

function fitFrame() { $('pv').style.transform = `scale(${$('pvBox').clientWidth / 1123})`; }
addEventListener('resize', fitFrame);

function renderPreview() {
  const pages = SheetRender.pageCount(data);
  pageIdx = Math.min(pageIdx, pages - 1);
  $('pv').srcdoc = SheetRender.render(data, { fontCss: FONT, imageUrl: imgUrl, watermark, page: pageIdx, screen: true });
  $('pvNav').hidden = pages < 2;
  $('pvIdx').textContent = `${pageIdx + 1} / ${pages}`;
  const n = data.names.length;
  $('namesHint').textContent = n ? `${n} طالب — ${pages} ${pages > 1 ? 'صفحات' : 'صفحة'}` : 'بدون أسماء يُطبع الكشف بصفوف فارغة تكتب فيها الأسماء يدويًا.';
  $('total').textContent = SheetRender.deg(SheetRender.totalMax(data));
}

function renderThemes() {
  $('themes').innerHTML = themes.map((t) => `<button type="button" class="th ${t.id === data.theme ? 'sel' : ''}" data-id="${t.id}"><i>${t.colors.map((c) => `<b style="background:${c}"></b>`).join('')}</i>${esc(t.name)}</button>`).join('');
  $('themes').querySelectorAll('.th').forEach((b) => b.onclick = () => { data.theme = b.dataset.id; renderThemes(); changed(); });
}

// محرر المجموعات والبنود
function renderGroups() {
  $('groups').innerHTML = data.groups.map((g, gi) => `
    <div class="grp" data-g="${gi}">
      <div class="grp-h"><input class="input" data-f="gtitle" value="${esc(g.title)}" maxlength="60" placeholder="اسم المجموعة">
        <span class="tot">${SheetRender.deg(SheetRender.groupMax(g))}</span>
        <button type="button" class="btn sm ghost danger x" data-act="delg" title="حذف المجموعة">🗑</button></div>
      <div class="sub-h"><span>البند</span><span>الدرجة</span><span>الخانات</span><span></span></div>
      ${g.subs.map((s, si) => `<div class="sub" data-s="${si}">
        <input class="input" data-f="title" value="${esc(s.title)}" maxlength="60" placeholder="اسم البند">
        <input class="input" data-f="max" type="number" min="0" max="100" value="${s.max}" dir="ltr">
        <input class="input" data-f="boxes" type="number" min="0" max="12" value="${s.boxes}" dir="ltr">
        <button type="button" class="btn sm ghost x" data-act="dels" title="حذف البند">✕</button></div>`).join('')}
      ${g.subs.length < 4 ? '<button type="button" class="btn sm ghost" data-act="adds" style="font-size:.85em">＋ بند</button>' : ''}
    </div>`).join('');
}
$('groups').addEventListener('input', (e) => {
  const gEl = e.target.closest('[data-g]'); if (!gEl) return;
  const g = data.groups[+gEl.dataset.g], f = e.target.dataset.f;
  if (f === 'gtitle') g.title = e.target.value;
  else {
    const s = g.subs[+e.target.closest('[data-s]').dataset.s];
    s[f] = f === 'title' ? e.target.value : Math.max(0, Math.min(f === 'max' ? 100 : 12, Math.round(+e.target.value || 0)));
    gEl.querySelector('.tot').textContent = SheetRender.deg(SheetRender.groupMax(g));
  }
  changed();
});
$('groups').addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
  const gi = +e.target.closest('[data-g]').dataset.g;
  if (act === 'delg') { if (data.groups.length > 1) data.groups.splice(gi, 1); else return toast('لازم مجموعة واحدة على الأقل', 'err'); }
  if (act === 'adds') data.groups[gi].subs.push({ title: '', max: 5, boxes: 4 });
  if (act === 'dels') {
    const si = +e.target.closest('[data-s]').dataset.s;
    if (data.groups[gi].subs.length > 1) data.groups[gi].subs.splice(si, 1); else return toast('لازم بند واحد على الأقل في المجموعة', 'err');
  }
  renderGroups(); changed();
});
$('addGroup').onclick = () => { if (data.groups.length >= 8) return toast('الحد الأقصى 8 مجموعات', 'err'); data.groups.push({ title: 'مجموعة جديدة', subs: [{ title: '', max: 10, boxes: 4 }] }); renderGroups(); changed(); };
$('resetGroups').onclick = () => { data.groups = JSON.parse(JSON.stringify(defaultGroups)); renderGroups(); changed(); };

// الشعارات
function renderLogos() {
  document.querySelectorAll('.logo-box').forEach((box) => {
    const key = box.dataset.logo, v = data[key];
    box.innerHTML = v ? `<img src="${imgUrl(v)}" alt=""><button type="button" class="btn sm ghost danger rm" title="إزالة">✕</button>` : `<div>＋<br>${key === 'logoRight' ? 'الشعار الأيمن' : 'الشعار الأيسر'}</div>`;
    const rm = box.querySelector('.rm');
    if (rm) rm.onclick = (e) => { e.stopPropagation(); data[key] = ''; renderLogos(); changed(); };
    box.onclick = () => { $('logoFile').dataset.key = key; $('logoFile').click(); };
  });
}
$('logoFile').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const fd = new FormData(); fd.append('file', f);
  try { const r = await api('POST', '/api/uploads', fd); data[$('logoFile').dataset.key] = r.id; renderLogos(); changed(); }
  catch (err) { toast(err.message, 'err'); }
};

// الحقول النصية
const FIELDS = ['line1', 'line2', 'school', 'title', 'year', 'grade', 'section', 'term', 'subject', 'teacher'];
function fillForm() {
  FIELDS.forEach((k) => { $('f-' + k).value = data[k] || ''; });
  $('f-names').value = data.names.join('\n');
  $('f-rows').value = data.rows;
}
document.querySelector('#form').addEventListener('input', (e) => {
  const idf = e.target.id || '';
  if (idf.startsWith('f-') && idf !== 'f-names' && idf !== 'f-rows') data[idf.slice(2)] = e.target.value;
  else if (idf === 'f-names') data.names = e.target.value.split('\n').map((s) => s.trim()).filter(Boolean);
  else return;
  changed();
});
$('f-rows').onchange = () => { data.rows = +$('f-rows').value; changed(); };
$('sortBtn').onclick = () => { data.names.sort((a, b) => a.localeCompare(b, 'ar')); $('f-names').value = data.names.join('\n'); changed(); };
$('title').addEventListener('input', () => scheduleSave());

function changed() { renderPreview(); scheduleSave(); }
function scheduleSave() { $('saveSt').textContent = 'جارٍ الحفظ...'; clearTimeout(saveTimer); saveTimer = setTimeout(save, 700); }
async function save() {
  clearTimeout(saveTimer);
  try { await api('PUT', '/api/sheets/' + id, { title: $('title').value, data }); $('saveSt').textContent = 'تم الحفظ ✓'; }
  catch (e) { $('saveSt').textContent = 'تعذر الحفظ'; toast(e.message, 'err'); }
}
$('pvPrev').onclick = () => { pageIdx = Math.max(0, pageIdx - 1); renderPreview(); };
$('pvNext').onclick = () => { pageIdx = Math.min(SheetRender.pageCount(data) - 1, pageIdx + 1); renderPreview(); };
const doPdf = async (btn) => { await save(); downloadPdf(null, btn, `/api/sheets/${id}/pdf`, 'كشف-متابعة.pdf'); };
$('pdfBtn').onclick = (e) => doPdf(e.currentTarget);
$('pdfBtn2').onclick = (e) => doPdf(e.currentTarget);

(async () => {
  const user = await currentUser();
  if (!user) return;
  watermark = !(user.isAdmin || user.subscription.active);
  try {
    const r = await api('GET', '/api/sheets/' + id);
    data = SheetRender.normalize(r.sheet.data); themes = r.themes; defaultGroups = r.defaultGroups;
    $('title').value = r.sheet.title;
    fillForm(); renderThemes(); renderGroups(); renderLogos(); renderPreview(); fitFrame();
    $('saveSt').textContent = 'كل التغييرات محفوظة';
  } catch (e) { toast(e.message, 'err'); setTimeout(() => { location.href = '/app'; }, 1200); }
})();
</script>
</body>
</html>
