<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة الملف</title>
<style>body{margin:0;background:#8a8f94;font-family:sans-serif;color:#fff;text-align:center;padding:40px 16px}</style></head>
<body>جارٍ تجهيز المعاينة...
<script src="assets/js/core.js"></script>
<script src="assets/js/mock.js"></script>
<script>
(async () => {
  const id = demoProjectId();
  const p = demoGetProject(id);
  if (!p) { document.body.innerHTML = '<p>الملف غير موجود. <a style="color:#fff" href="app.html">العودة لملفاتي</a></p>'; return; }
  let html = await InjazCore.renderProject(p, { screen: true, imageUrl: uploadUrl });
  html = html.replace(/url\(\/fonts\//g, 'url(fonts/');
  const bar = `<div style="position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;background:#fff;color:#2f3432;padding:10px 16px;font:500 14px Tajawal,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.2);margin:-8mm 0 8mm">
    <a href="editor.html#p${p.id}" style="background:#5f978f;color:#fff;text-decoration:none;padding:6px 14px;border-radius:8px;font-weight:700">→ العودة للمحرر</a>
    <span>هذا شكل الملف عند تصديره PDF</span></div>`;
  html = html.replace(/<body([^>]*)>/, `<body$1>${bar}`);
  document.open(); document.write(html); document.close();
  const fitZoom = () => { const sh = document.querySelector('.sheet'); if (!sh) return; document.body.style.zoom = ''; const w = sh.offsetWidth + 16; document.body.style.zoom = Math.min(1, innerWidth / w); };
  window.addEventListener('load', fitZoom); window.addEventListener('resize', fitZoom); setTimeout(fitZoom, 100);
})();
</script>
</body></html>
